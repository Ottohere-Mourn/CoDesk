<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Northstar OrderDesk</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">NORTHSTAR OPERATIONS</p>
      <h1>OrderDesk</h1>
      <p>Review recent synthetic orders and their current status.</p>
    </header>
    <section aria-labelledby="queue-heading">
      <h2 id="queue-heading">Order queue</h2>
      <form id="filter-form" action="/" method="get">
        <div class="field">
          <label for="order-query">Search order, customer, or region</label>
          <input id="order-query" name="query" type="search" autocomplete="off">
        </div>
        <div class="field">
          <label for="order-status">Order status</label>
          <select id="order-status" name="status">
            <option>All</option><option>Processing</option><option>Shipped</option><option>Delivered</option>
          </select>
        </div>
        <button id="apply-filters" type="submit">Apply filters</button>
        <button id="clear-filters" type="reset" class="secondary">Clear</button>
      </form>
      <p id="result-count" role="status" aria-live="polite" tabindex="-1">Loading orders…</p>
      <p id="empty-state" hidden>No orders match these filters.</p>
      <div class="table-wrap">
        <table>
          <caption>Orders</caption>
          <thead><tr><th scope="col">Order</th><th scope="col">Customer</th><th scope="col">Region</th><th scope="col">Status</th><th scope="col">Total</th></tr></thead>
          <tbody id="order-results"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
