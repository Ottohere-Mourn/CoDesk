<header class="wrap">

    <div>
      <h1>共享桌面案例库</h1>
      <p>一处浏览 CoDesk 本工作流创建的双 Agent、Human-Agent 与机制扩展案例。可按主题筛选、搜索任务概要，并直接查看已归档的关键截图。</p>
      <div class="updated">静态离线页面 · 目录数据来自 case-catalog.csv · 更新于 2026-11-19</div>
    </div>
    <div class="stats" aria-label="案例统计">
      <div class="stat"><strong id="total-count">—</strong><span>案例总数</span></div>
      <div class="stat"><strong id="image-count">—</strong><span>可浏览关键截图</span></div>
      <div class="stat"><strong id="family-count">—</strong><span>案例主题</span></div>
    </div>
  </div>
</header>
<section class="control-panel">
  <div class="wrap">
    <div class="controls">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="query" type="search" placeholder="搜索 Case ID、场景或机制…" autocomplete="off" aria-label="搜索案例"></label>
      <select id="image-filter" aria-label="按截图状态筛选"><option value="all">全部截图状态</option><option value="with">有关键截图</option><option value="without">截图待补</option></select>
      <select id="family-select" aria-label="按主题筛选"><option value="all">全部主题</option></select>
      <div class="result-count" id="result-count" aria-live="polite"></div>
    </div>
    <nav class="family-nav" id="family-nav" aria-label="案例主题快捷筛选"></nav>
    <div class="legend">截图缺口会明确标注；scripted controls 结果不会混作模型实验结论。</div>
  </div>
</section>
<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty"><strong>没有找到匹配案例</strong>试试其他关键词，或清除当前筛选条件。</div>
  <div class="footer-note">原始轨迹和完整运行证据仍保存在对应实验归档中。本页展示的是便于浏览的精选图，不替代原始评测记录。</div>
</main>

<script>
const cases=JSON.parse(document.getElementById('case-data').textContent);
const grid=document.getElementById('grid'), query=document.getElementById('query'), imageFilter=document.getElementById('image-filter'), familySelect=document.getElementById('family-select'), resultCount=document.getElementById('result-count'), empty=document.getElementById('empty');
const families=[...new Set(cases.map(c=>c.family))]; let activeFamily='all';
document.getElementById('total-count').textContent=cases.length;
document.getElementById('image-count').textContent=cases.filter(c=>c.screenshot_file).length;
document.getElementById('family-count').textContent=families.length;
for(const f of families){const o=document.createElement('option');o.value=f;o.textContent=f;familySelect.append(o)}
const nav=document.getElementById('family-nav');
function mkChip(label,value){const b=document.createElement('button');b.className='chip'+(value==='all'?' active':'');b.textContent=label;b.dataset.value=value;b.onclick=()=>{activeFamily=value;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.value===value));familySelect.value=value;render()};return b}
nav.append(mkChip('全部案例','all')); families.forEach(f=>nav.append(mkChip(f,f)));
function esc(s){return String(s||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function sourceHref(s){let p=(s||'').split(/[；;]/)[0].trim();p=p.split(' §')[0].trim();return p?('../../'+p.replace(/^\.\//,'')):''}
function render(){const q=query.value.trim().toLocaleLowerCase(); const im=imageFilter.value; const chosen=familySelect.value; activeFamily=chosen;
  const filtered=cases.filter(c=>(chosen==='all'||c.family===chosen)&&(im==='all'||(im==='with'?!!c.screenshot_file:!c.screenshot_file))&&(!q||[c.case_id,c.family,c.text_summary,c.evidence_state,c.source_doc].join(' ').toLocaleLowerCase().includes(q)));
  resultCount.textContent=`显示 ${filtered.length} / ${cases.length} 项`;
  grid.innerHTML=filtered.map((c,i)=>{const has=!!c.screenshot_file; const control=/尚无模型三臂/.test(c.evidence_state); const src=sourceHref(c.source_doc); const shortSource=(c.source_doc||'来源未注明').split(/[；;]/)[0];
    const visual=has?`<div class="visual"><img src="${esc(c.screenshot_file)}" alt="${esc(c.case_id)} 关键桌面截图" loading="lazy" decoding="async" data-zoom="${esc(c.screenshot_file)}"><span class="photo-label">KEY SCREENSHOT</span></div>`:`<div class="visual missing"><div class="no-photo"><b>截图待补</b><span>此案例目前没有可用的随附图片</span></div></div>`;
    const badge=control?'仅脚本控制':(c.case_id==='MECH06'?'目标组合命中一次':'查看实验记录');
    return `<article class="case" data-case="${esc(c.case_id)}">${visual}<div class="body"><div class="meta"><span class="id">${esc(c.case_id)}</span><span class="family">${esc(c.family)}</span></div><h2>${esc(c.case_id)}</h2><p class="summary">${esc(c.text_summary)}</p><p class="evidence">${esc(c.evidence_state)}</p></div><div class="foot">${src?`<a class="source" href="${esc(src)}" title="${esc(shortSource)}">${esc(shortSource)}</a>`:`<span class="source">${esc(shortSource)}</span>`}<span class="badge ${control?'control':''}">${esc(badge)}</span></div></article>`
  }).join('');
  empty.style.display=filtered.length?'none':'block';
  grid.querySelectorAll('[data-zoom]').forEach(img=>img.addEventListener('click',()=>openZoom(img.dataset.zoom,img.alt)));
}
query.addEventListener('input',render); imageFilter.addEventListener('change',render); familySelect.addEventListener('change',()=>{activeFamily=familySelect.value;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.value===activeFamily));render()});
const overlay=document.getElementById('overlay'), zoomed=document.getElementById('zoomed');function openZoom(src,alt){zoomed.src=src;zoomed.alt=alt;overlay.classList.add('open');document.body.style.overflow='hidden'}function closeZoom(){overlay.classList.remove('open');zoomed.src='';document.body.style.overflow=''}document.getElementById('close').onclick=closeZoom;overlay.addEventListener('click',e=>{if(e.target===overlay)closeZoom()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom()});
render();
</script>
