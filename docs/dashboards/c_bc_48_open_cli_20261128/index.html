<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoDesk · C + BC 48 Case 轨迹看板</title>
<style>
:root{--ink:#1b2c47;--muted:#718097;--line:#dfe6ef;--bg:#f4f7fb;--blue:#285bc0;--purple:#8053b7;--green:#11745b;--red:#b63848}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,a{cursor:pointer}a{color:var(--blue)}header{background:#172c4c;color:white;padding:25px max(24px,calc((100vw - 1480px)/2))}header small{letter-spacing:.18em;color:#adc3e9}h1{margin:4px 0;font-size:27px}header p{margin:0;color:#c7d4e9}.wrap{max-width:1528px;padding:22px 24px;margin:auto}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}.stat,.panel,.table-wrap{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 5px 22px #17325206}.stat{padding:14px 16px}.number{font-size:25px;font-weight:730;font-variant-numeric:tabular-nums}.label,.muted{color:var(--muted)}.label{font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}input,select,button,.button{background:white;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink)}input{min-width:250px;flex:1}button.active{color:white;background:var(--blue);border-color:var(--blue)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #edf1f7}th{background:#f8fafd;color:var(--muted);font-size:12px}tbody tr:hover{background:#f3f7ff;cursor:pointer}td:first-child{font-weight:750;color:var(--blue)}.title{max-width:260px;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-block;border-radius:30px;padding:2px 8px;font-size:11px;background:#eef2f8;color:#536985}.pass{color:var(--green);background:#e7f5ef}.fail{color:var(--red);background:#ffedf0}.running{color:var(--blue);background:#e9f0ff}.hidden{display:none!important}.panel{padding:16px;margin:14px 0}.detail-top{display:flex;justify-content:space-between;gap:18px;align-items:start}h2{margin:0 0 4px}h3{margin:0 0 10px;font-size:16px}.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.actors{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.actor-col{min-width:0}.actor-head{padding:12px;border:1px solid #d8e3fa;border-radius:9px;background:#eaf1ff;margin-bottom:10px;position:sticky;top:0;z-index:2}.actor-head.b{background:#f3edfc;border-color:#e4d8f6}.actor-head b{font-size:16px}.actor-head span{float:right;font-size:12px}.action{border:1px solid var(--line);border-left:4px solid #b7c5da;border-radius:9px;background:white;margin-bottom:10px;overflow:hidden}.action.cli{border-left-color:var(--blue)}.action.overlap{border-left-color:#d59625}.action.error{border-left-color:var(--red)}.action-top{padding:8px 10px;background:#f8fafd;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.when{font-size:11px;color:var(--muted)}.tool{font:700 12px Consolas,monospace}.action-body{padding:10px}pre{font:12px/1.5 Consolas,monospace;background:#f4f6fa;padding:10px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;margin:5px 0 10px}.shot{display:block;max-width:100%;max-height:290px;object-fit:contain;border-radius:6px;border:1px solid var(--line);margin:10px auto 0;cursor:zoom-in}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button{font-size:12px;padding:6px 11px}.note{font-size:12px;color:var(--muted)}.downloads{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:9px 0}.checks{white-space:normal;font-size:12px}.checks td{vertical-align:top}.checks th{position:static}.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.check-box{overflow:auto;border:1px solid var(--line);border-radius:8px}.check-box h4{padding:10px;margin:0;background:#f8fafd}.check-box td:last-child{min-width:180px}.modal{position:fixed;inset:0;background:#0b1629ed;display:grid;place-items:center;padding:25px;z-index:30}.modal img{max-width:96vw;max-height:92vh;object-fit:contain}.modal button{position:absolute;right:20px;top:16px}.empty{padding:28px;text-align:center;color:var(--muted)}footer{font-size:12px;color:var(--muted);text-align:center;padding:25px}.sort{border:0;background:none;padding:0;color:inherit}.legend{font-size:11px;color:var(--muted);margin:10px 0}.score{font-weight:700;font-variant-numeric:tabular-nums}.grade-raw{max-height:440px}details summary{cursor:pointer;color:var(--muted);font-size:12px}@media(max-width:1000px){.check-grid{grid-template-columns:1fr}.actors{gap:10px}}@media(max-width:760px){.actors{grid-template-columns:1fr}.actor-head{position:static}.wrap{padding:16px 12px}.stats{grid-template-columns:repeat(2,1fr)}.detail-top{flex-direction:column}h1{font-size:23px}header{padding:20px}}
</style>
</head>
<body>
<header><small>CODESK · SHARED · GUI + CLI</small><h1>C + BC · 48 Case 轨迹看板</h1><p id="subtitle">正在加载归档结果…</p></header>
<main class="wrap">
<section id="overview"><div class="stats" id="stats"></div><div class="toolbar"><input id="search" placeholder="搜索 Case、任务名称或 Run ID"><select id="series"><option value="all">全部系列</option><option value="C">C01–C24</option><option value="BC">BC01–BC24</option></select><select id="status"><option value="all">全部状态</option><option value="done">有效结果</option><option value="running">无有效成绩 / 待处理</option><option value="joint">Joint pass</option><option value="notjoint">Joint 未通过</option></select><select id="sort"><option value="id">按 Case 排序</option><option value="score">按平均分降序</option><option value="steps">按总步数降序</option></select></div><div id="rowCount" class="note"></div><div class="table-wrap"><table><thead><tr><th>Case / 任务</th><th>状态</th><th>A 步数 / 分数</th><th>B 步数 / 分数</th><th>GUI A/B</th><th>CLI A/B</th><th>Joint</th><th>耗时</th><th>截图</th></tr></thead><tbody id="rows"></tbody></table></div><p class="legend">步数 = actions.jsonl 记录数（含截图）；GUI = 桌面输入工具调用；CLI = guest_cli 调用。C 系列未定义严格 joint_pass，显示 —。</p></section>
<section id="detail" class="hidden"></section>
<footer>CoDesk · 静态归档看板 · <a href="snapshot.json" download>结果索引</a> · <a href="validation.json" download>完整性校验</a></footer>
</main><div id="modal" class="modal hidden"><button id="closeModal">关闭 ✕</button><img id="modalImage" alt="轨迹截图"></div>
<script src="dashboard-data.js"></script>
<script>
(()=>{
'use strict';
const snap=window.CONC_SNAPSHOT,$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!snap){$('#subtitle').textContent='缺少 dashboard-data.js';return;}
const cases=snap.cases||[],done=cases.filter(c=>c.validResult),allActions=done.flatMap(c=>[...(c.actions?.A||[]),...(c.actions?.B||[])]);
let active=null,filter='all',query='';
const fmt=n=>typeof n==='number'?n.toFixed(4):'—',duration=n=>typeof n==='number'?`${Math.floor(n/60)}m ${Math.round(n%60)}s`:'—';
const when=t=>{let d=new Date(typeof t==='number'?(t>1e12?t:t*1000):t);return Number.isNaN(d.valueOf())?'—':d.toLocaleString('zh-CN',{hour12:false});};
const cli=a=>/guest_cli/i.test([a.tool,a.server].join(' '));
const gui=a=>!cli(a)&&/click|type|key|press|scroll|drag|move|hotkey|mouse|computer/i.test(a.tool||'');
const cmdFail=a=>cli(a)&&(a.result?.ok===false||(Number.isInteger(a.result?.returncode)&&a.result.returncode!==0));
const toolFail=a=>!!a.error||!a.result||['error','failed','denied'].includes(a.result?.status)||(a.http_requests||[]).some(h=>h.status_code>=400);
const declared=a=>/declare_infeasible/.test(a.tool||'');
const avg=role=>done.length?done.reduce((s,c)=>s+Number(c.scores?.[role]||0),0)/done.length:0;
const badge=c=>c.validResult?`<span class="pill pass">${c.offlineRecovery?'离线补评':'已完成'}</span>`:`<span class="pill running">${esc(c.status==='DEFERRED_NETWORK'?'网络断流暂缓':c.status)}</span>`;
const joint=c=>typeof c.jointPass!=='boolean'?'—':`<span class="pill ${c.jointPass?'pass':'fail'}">${c.jointPass?'PASS':'FAIL'}</span>`;
const stat=(label,num)=>`<div class="stat"><div class="number">${esc(num)}</div><div class="label">${esc(label)}</div></div>`;
const shots=done.reduce((s,c)=>s+Object.values(c.screenshotCounts||{}).reduce((a,b)=>a+b,0),0);
$('#subtitle').textContent=`更新 ${when(snap.generated_utc)} · ${done.length}/48 份有效结果 · Shared 双人 · GUI + 可读写 CLI`;
$('#stats').innerHTML=stat('已完成 Case',`${done.length} / 48`)+stat('Actor A / B 平均分',`${avg('A').toFixed(3)} / ${avg('B').toFixed(3)}`)+stat('归档动作 / 截图',`${allActions.length} / ${shots}`)+stat('GUI / CLI 调用',`${allActions.filter(gui).length} / ${allActions.filter(cli).length}`)+stat('BC 严格 Joint pass',`${done.filter(c=>c.jointPass===true).length} / ${done.filter(c=>typeof c.jointPass==='boolean').length}`);
function renderRows(){
 const s=$('#series').value,f=$('#status').value,q=$('#search').value.toLowerCase();
 const xs=cases.filter(c=>(s==='all'||c.series===s)&&(`${c.id} ${c.title} ${c.runId}`.toLowerCase().includes(q))&&(f==='all'||f==='done'&&c.validResult||f==='running'&&!c.validResult||f==='joint'&&c.jointPass===true||f==='notjoint'&&c.jointPass===false));
 const sorting=$('#sort').value;
 if(sorting==='score')xs.sort((a,b)=>((b.scores?.A||0)+(b.scores?.B||0))-((a.scores?.A||0)+(a.scores?.B||0)));
 if(sorting==='steps')xs.sort((a,b)=>((b.steps?.A||0)+(b.steps?.B||0))-((a.steps?.A||0)+(a.steps?.B||0)));
 $('#rowCount').textContent=`${xs.length} / 48 Case`;
 $('#rows').innerHTML=xs.map(c=>`<tr data-id="${esc(c.id)}"><td><div>${esc(c.id)}</div><div class="title meta" title="${esc(c.title)}">${esc(c.title===c.id?'':c.title)}</div></td><td>${badge(c)}</td><td>${c.steps?.A??'—'} / <span class="score">${fmt(c.scores?.A)}</span></td><td>${c.steps?.B??'—'} / <span class="score">${fmt(c.scores?.B)}</span></td><td>${c.metrics?.A?.gui??'—'} / ${c.metrics?.B?.gui??'—'}</td><td>${c.metrics?.A?.cli??'—'} / ${c.metrics?.B?.cli??'—'}</td><td>${joint(c)}</td><td>${duration(c.duration_s)}</td><td>${Object.values(c.screenshotCounts||{}).reduce((a,b)=>a+b,0)}</td></tr>`).join('');
 $('#rows').querySelectorAll('tr').forEach(tr=>tr.onclick=()=>location.hash=tr.dataset.id);
}
function checks(grade){
 if(!grade)return '<p class="note">C 系列保留原评测分数；未补造严格 joint_pass 或新评分字段。</p>';
 const sub=grade.subchecks||{};
 return '<div class="check-grid">'+[['actor_a','Actor A'],['actor_b','Actor B'],['joint','Joint']].map(([key,title])=>`<div class="check-box"><h4>${title}</h4><table class="checks"><thead><tr><th>检查项</th><th>结果 / 权重</th><th>证据</th></tr></thead><tbody>${(sub[key]||[]).map(x=>`<tr><td>${esc(x.id)}${x.required?' *':''}</td><td><span class="pill ${x.passed?'pass':'fail'}">${x.passed?'PASS':'FAIL'}</span><br>${esc(x.weight??'—')}</td><td>${esc(typeof x.evidence==='string'?x.evidence:JSON.stringify(x.evidence??''))}</td></tr>`).join('')}</tbody></table></div>`).join('')+'</div>';
}
function openCase(c){
 active=c;filter='all';query='';$('#overview').classList.add('hidden');$('#detail').classList.remove('hidden');
 const metrics=c.metrics||{},decl=['A','B'].filter(r=>metrics[r]?.declaredInfeasible).join(', ')||'无';
 $('#detail').innerHTML=`<div class="detail-top"><div><button id="back">← 返回全部案例</button><h2 style="margin-top:12px">${esc(c.id)} · ${esc(c.title===c.id?'轨迹复盘':c.title)}</h2><div class="meta">${esc(c.runId)} · ${badge(c)} · ${duration(c.duration_s)} · Joint ${joint(c)}</div></div><div class="meta">declare_infeasible：${decl}<br>A 状态：${esc(c.actorStatuses?.A||'—')}<br>B 状态：${esc(c.actorStatuses?.B||'—')}</div></div><div class="stats" style="margin-top:16px">${stat('Actor A：步数 / 分数',`${c.steps?.A??'—'} / ${fmt(c.scores?.A)}`)}${stat('Actor B：步数 / 分数',`${c.steps?.B??'—'} / ${fmt(c.scores?.B)}`)}${stat('≤1.5s GUI 动作交叠对',c.guiOverlapPairs??'—')}${stat('CLI 命令失败 / 工具异常',`${(metrics.A?.cliCommandFailures||0)+(metrics.B?.cliCommandFailures||0)} / ${(metrics.A?.cliToolFailures||0)+(metrics.B?.cliToolFailures||0)}`)}</div><div class="downloads"><a href="data/${esc(c.id)}/summary.json" download>结果摘要</a><a href="data/${esc(c.id)}/actions-A.json" download>A 完整动作</a><a href="data/${esc(c.id)}/actions-B.json" download>B 完整动作</a>${c.grade?`<a href="data/${esc(c.id)}/grade.json" download>grade.json</a><a href="data/${esc(c.id)}/shared_timeline.json" download>shared_timeline.json</a>`:''}</div><details class="panel"><summary>评分检查项与失败原因</summary>${c.failureReason?`<pre>${esc(c.failureReason)}</pre>`:""}${checks(c.grade)}${c.grade?.failure_reasons?.length?`<pre>${esc(JSON.stringify(c.grade.failure_reasons,null,2))}</pre>`:''}<details><summary>原始评分详情</summary><pre class="grade-raw">${esc(JSON.stringify(c.grade||c.legacyScores,null,2))}</pre></details></details><div class="panel"><div class="toolbar" style="margin-top:0"><div class="filters" id="filters">${[['all','全部动作'],['gui','GUI'],['cli','CLI'],['error','异常'],['overlap','GUI 交叠'],['declare','弃权']].map(([v,t])=>`<button data-filter="${v}" class="${v==='all'?'active':''}">${t}</button>`).join('')}</div><input id="actionSearch" placeholder="搜索命令、工具或输出"></div><div class="note">GUI 交叠按双方动作起点相差 ≤1.5s 统计，是时间邻近记录，不等同于已证实冲突。CLI 命令失败与工具异常分别计数，可能重叠。</div></div><div class="actors" id="actors"></div>`;
 $('#back').onclick=()=>{location.hash='';};
 $('#filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$('#filters').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));renderActions();});
 $('#actionSearch').oninput=e=>{query=e.target.value.toLowerCase();renderActions();};
 renderActions();window.scrollTo(0,0);
}
function renderActions(){
 const c=active;if(!c)return;
 $('#actors').innerHTML=['A','B'].map(role=>{
  const rows=c.actions?.[role]||[],m=c.metrics?.[role]||{},overlaps=new Set((c.overlapPairs||[]).map(p=>role==='A'?p.a:p.b));
  const selected=rows.filter(a=>(filter==='all'||filter==='gui'&&gui(a)||filter==='cli'&&cli(a)||filter==='error'&&(toolFail(a)||cmdFail(a))||filter==='overlap'&&overlaps.has(a.n)||filter==='declare'&&declared(a))&&(!query||JSON.stringify(a).toLowerCase().includes(query)));
  return `<div class="actor-col"><div class="actor-head ${role==='B'?'b':''}"><b>Actor ${role}</b><span>${selected.length}/${rows.length} 步 · GUI ${m.gui||0} · CLI ${m.cli||0}</span></div>${selected.map(a=>{
   const error=toolFail(a)||cmdFail(a),overlap=overlaps.has(a.n),shot=a.screenshot_artifact?.path;
   return `<article class="action ${cli(a)?'cli':''} ${overlap?'overlap':''} ${error?'error':''}"><div class="action-top"><b>#${esc(a.n)}</b><span class="tool">${esc(a.tool)}</span><span class="when">${when(a.t)}</span>${cli(a)?'<span class="pill running">CLI</span>':''}${overlap?'<span class="pill">交叠</span>':''}${error?'<span class="pill fail">异常</span>':''}</div><div class="action-body"><div class="label">参数 / 命令</div><pre>${esc(JSON.stringify(a.args||{},null,2))}</pre>${a.code?`<details><summary>执行代码</summary><pre>${esc(a.code)}</pre></details>`:''}<details ${cli(a)?'open':''}><summary>工具返回${a.tool_elapsed_s!=null?' · '+esc(a.tool_elapsed_s)+'s':''}</summary><pre>${esc(JSON.stringify(a.result??a.error??null,null,2))}</pre></details>${shot?`<img class="shot" loading="lazy" src="assets/${esc(c.id)}/${role}/${esc(shot)}" alt="${esc(c.id)} ${role} #${esc(a.n)} 截图">`:''}</div></article>`;
  }).join('')||'<div class="empty">没有匹配动作</div>'}</div>`;
 }).join('');
 $('#actors').querySelectorAll('.shot').forEach(img=>img.onclick=()=>{$('#modalImage').src=img.src;$('#modal').classList.remove('hidden');});
}
function route(){const id=decodeURIComponent(location.hash.slice(1)),c=cases.find(c=>c.id===id);if(c&&c.traceAvailable)openCase(c);else{active=null;$('#overview').classList.remove('hidden');$('#detail').classList.add('hidden');renderRows();}}
['search','series','status','sort'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',renderRows));
$('#closeModal').onclick=()=>$('#modal').classList.add('hidden');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.add('hidden');};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.add('hidden');});
window.addEventListener('hashchange',route);route();window.dashboardReady=true;
})();
</script></body></html>
