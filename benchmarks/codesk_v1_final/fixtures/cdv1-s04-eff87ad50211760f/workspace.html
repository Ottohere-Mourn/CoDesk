<!doctype html><meta charset='utf-8'><title>CoDesk operation task</title><main data-layout='target-before-guard'><h1>CoDesk operation task</h1><p>Complete the two independent assigned GUI operations.</p>
<table><tbody><tr><td><input type='checkbox' data-row='1'></td><td>Record 1</td><td id='status-1'>pending</td></tr><tr><td><input type='checkbox' data-row='2'></td><td>Record 2</td><td id='status-2'>pending</td></tr><tr><td><input type='checkbox' data-row='3'></td><td>Record 3</td><td id='status-3'>pending</td></tr><tr><td><input type='checkbox' data-row='4'></td><td>Record 4</td><td id='status-4'>pending</td></tr><tr><td><input type='checkbox' data-row='5'></td><td>Record 5</td><td id='status-5'>pending</td></tr><tr><td><input type='checkbox' data-row='6'></td><td>Record 6</td><td id='status-6'>pending</td></tr></tbody></table>
<p>Actor A owns rows [1, 2] and must apply Cleared; Actor B owns rows [3, 4] and must apply Inspected.</p><button id='bulk-a'>Apply Actor A status</button><button id='bulk-b'>Apply Actor B status</button>
<script>document.querySelectorAll('input[data-row]').forEach(x=>x.onchange=()=>{const rows=[...document.querySelectorAll('input[data-row]:checked')].map(y=>Number(y.dataset.row));fetch('/select',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows})});});
document.querySelector('#bulk-a').onclick=()=>fetch('/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor:'A',status:'Cleared'})}).then(r=>r.json()).then(x=>x.rows.forEach(i=>document.querySelector('#status-'+i).textContent=x.status));
document.querySelector('#bulk-b').onclick=()=>fetch('/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor:'B',status:'Inspected'})}).then(r=>r.json()).then(x=>x.rows.forEach(i=>document.querySelector('#status-'+i).textContent=x.status));</script></main>
