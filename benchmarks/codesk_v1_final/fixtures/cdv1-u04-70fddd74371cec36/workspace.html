<!doctype html><meta charset='utf-8'><title>CoDesk operation task</title><main data-layout='target-before-guard'><h1>CoDesk operation task</h1><p>Complete the two independent assigned GUI operations.</p>
<p>Preserve both assigned phrases: TEMP-SAFE-1193 and FINAL-SAFE-1193.</p><div id='editor' contenteditable='true' role='textbox' aria-label='Shared rich text editor'>Seed A Seed B</div><button id='save-a'>Record A edit</button><button id='save-b'>Record B edit</button><script>document.querySelector('#save-a').onclick=()=>fetch('/editor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor:'A',value:document.querySelector('#editor').innerText})});document.querySelector('#save-b').onclick=()=>fetch('/editor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor:'B',value:document.querySelector('#editor').innerText})});</script>
<script>document.querySelectorAll('form').forEach(f=>f.addEventListener('submit',async e=>{e.preventDefault();const actor=f.dataset.actor;const value=f.querySelector('input').value;await fetch('/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor,value})});}));</script></main>
