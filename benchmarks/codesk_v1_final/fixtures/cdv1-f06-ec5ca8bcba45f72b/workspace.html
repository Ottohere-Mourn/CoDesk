<!doctype html><meta charset='utf-8'><title>CoDesk operation task</title><main data-layout='target-before-guard'><h1>CoDesk operation task</h1><p>Complete the two independent assigned GUI operations.</p>
<p>Record SUP-2048 must be changed to Accepted.</p><form data-actor='A'><label>Record ID <input name='record' aria-label='Record ID'></label><label>Status <input name='status' aria-label='Status'></label><button>Submit record</button></form>
<script>document.querySelectorAll('form').forEach(f=>f.addEventListener('submit',async e=>{e.preventDefault();const actor=f.dataset.actor;const fields=Object.fromEntries(new FormData(f).entries());const value=JSON.stringify(fields);await fetch('/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor,value})});}));</script></main>
