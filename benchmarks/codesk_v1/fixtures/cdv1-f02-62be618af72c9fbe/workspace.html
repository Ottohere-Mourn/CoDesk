<!doctype html><meta charset='utf-8'><title>Capital allocation review</title><main data-layout='target-before-guard'><h1>Capital allocation review</h1><h2>Review CASE-4821</h2>
<label>Case<input id='case' value='CASE-4821'></label>
<label>Decision<input id='decision' value='APPROVED'></label>
<button id='submit'>Submit review</button>
<script>document.querySelector('#submit').onclick=async()=>{await fetch('/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case:document.querySelector('#case').value,decision:document.querySelector('#decision').value})})}</script></main>
