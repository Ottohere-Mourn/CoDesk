<!doctype html><meta charset='utf-8'><title>CoDesk C-02 hyperlink transfer</title><main data-layout='guard-before-target'><h1>CoDesk C-02 hyperlink transfer</h1><a id='source-a' href='https://example.org/capital_allocation/href_source'>Open capital request reference</a>
<p id='source-b'>Destination URL: https://example.org/capital_allocation/submit</p>
<form id='submit-form'><input id='value' aria-label='URL destination'><button>Submit URL</button></form>
<script>document.querySelector('#submit-form').addEventListener('submit',async e=>{e.preventDefault();await fetch('/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.querySelector('#value').value})});});</script></main>
