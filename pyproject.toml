[project]
name = "oscombo"
version = "0.1.0"
description = "Composite OSWorld tasks: several official OSWorld tasks on one shared desktop, pluggable models and harnesses"
readme = "README.md"
requires-python = ">=3.10"
# Runs inside the OSWorld-V2 venv (desktop_env, mm_agents and their dependencies come from there).
dependencies = ["requests", "pillow"]

[project.optional-dependencies]
mcp = ["mcp==1.16.0", "starlette>=0.40,<0.48", "PyJWT>=2.8,<2.9"]
test = ["pytest"]
local = ["pyautogui~=0.9.54"]  # host X11/Xephyr control for OSCOMBO_BACKEND=local

[project.scripts]
oscombo = "oscombo.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oscombo*"]

[tool.setuptools.package-data]
"oscombo.harness" = ["*.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
