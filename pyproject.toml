[project]
name = "oscombo"
version = "0.1.0"
description = "Composite OSWorld tasks: several official OSWorld tasks on one shared desktop, pluggable models and harnesses"
readme = "README.md"
requires-python = ">=3.10"
# Runs inside the OSWorld-V2 venv (desktop_env, mm_agents and their dependencies come from there).
dependencies = ["requests", "pillow"]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]  # FastMCP API; mcp 2.x renamed it
test = ["pytest"]

[project.scripts]
oscombo = "oscombo.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oscombo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
