<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CONC Batch 1 · 双 Actor 轨迹复盘</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#65718a;--line:#dce2eb;--paper:#f5f7fb;--white:#fff;--blue:#3468d4;--blue-bg:#eef4ff;--amber:#a75c00;--amber-bg:#fff3dc;--red:#b3261e;--red-bg:#ffeded;--green:#167447;--green-bg:#e8f7ef;--shadow:0 5px 20px #15284a12}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--blue)}
    .top{background:#14213d;color:#fff;padding:22px max(24px,calc((100vw - 1440px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}.top h1{font-size:21px;margin:0 0 3px}.top p{margin:0;color:#cad5ec}.top .tag{border:1px solid #506184;padding:6px 10px;border-radius:999px;font-size:12px;white-space:nowrap}
    main{max-width:1440px;padding:24px;margin:auto}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar button,.toolbar select,.toolbar input{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 12px;color:var(--ink)}.toolbar button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.toolbar .grow{flex:1}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px;margin-bottom:18px}.stat,.panel,.case-card{background:var(--white);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:15px 17px}.stat .num{font-size:23px;font-weight:750}.stat .label{color:var(--muted);font-size:12px}
    .table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:1220px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #edf0f5}th{font-size:12px;color:var(--muted);background:#fafbfe;position:sticky;top:0}tbody tr{cursor:pointer}tbody tr:hover{background:#f4f7ff}tbody tr:last-child td{border-bottom:0}.case-id{font-weight:750;color:#203e79}.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;background:#eef1f6;color:#364158;font-size:12px;white-space:nowrap}.pill.ok{background:var(--green-bg);color:var(--green)}.pill.issue{background:var(--amber-bg);color:var(--amber)}.pill.alert{background:var(--red-bg);color:var(--red)}.score{font-variant-numeric:tabular-nums;font-weight:700}.muted{color:var(--muted)}
    .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:8px 0 16px}.detail-head h2{margin:0 0 5px}.detail-head .meta{color:var(--muted)}.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px;margin:12px 0 18px}.summary-grid .stat{padding:12px 14px}.summary-grid .num{font-size:18px}.panel{padding:16px;margin:14px 0}.panel h3{margin:0 0 12px;font-size:16px}.actor-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.actor-col{min-width:0}.actor-title{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#eaf0fc;border:1px solid #d5e0f7;border-radius:11px;margin-bottom:9px}.actor-title.b{background:#f0ebfa;border-color:#dfd4f4}.actor-title strong{font-size:15px}.timeline{display:flex;flex-direction:column;gap:9px}.action{border:1px solid var(--line);border-left:4px solid #aab6c8;background:#fff;border-radius:10px;overflow:hidden}.action.conflict{border-color:#e8a23b;border-left-color:#e28b10;background:#fffaf0}.action.error{border-left-color:#cc433c}.action.declare{border-left-color:#ab40a3;background:#fff8ff}.action-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;background:#fafbfe;border-bottom:1px solid #edf0f5}.step{font-weight:750}.time{color:var(--muted);font-size:12px}.tool{font-family:ui-monospace,Consolas,monospace;font-weight:650;color:#243a66}.action-body{padding:10px}.action-body pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fb;padding:9px;border-radius:7px;margin:5px 0 9px;font:12px/1.45 ui-monospace,Consolas,monospace;max-height:280px;overflow:auto}.label{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:8px}.reason{white-space:pre-wrap;border-left:3px solid #bb4ba9;padding:7px 10px;background:#fff6ff;border-radius:0 7px 7px 0}.shot{display:block;width:100%;max-height:310px;object-fit:contain;background:#dfe4ed;border:1px solid #d4dbe6;border-radius:7px;margin-top:8px;cursor:zoom-in}.shot-link{display:block}.reply-list{display:flex;flex-direction:column;gap:9px;max-height:430px;overflow:auto}.reply{border:1px solid var(--line);background:#fbfcff;border-radius:9px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}.reply small{display:block;color:var(--muted);margin-bottom:4px}.flag{font-size:11px;border-radius:99px;padding:2px 7px;background:var(--amber-bg);color:var(--amber);font-weight:700}.flag.red{background:var(--red-bg);color:var(--red)}.flag.purple{background:#f6e8f7;color:#91318b}.empty{padding:26px;text-align:center;color:var(--muted)}.hidden{display:none!important}.relay-grid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px}.relay-stat{background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:10px}.relay-stat b{display:block;font-size:18px}.relay-list{margin-top:10px;max-height:280px;overflow:auto;border-top:1px solid var(--line)}.relay-row{display:grid;grid-template-columns:60px 1fr 70px 90px;gap:8px;padding:7px;border-bottom:1px solid #edf0f5;font:12px ui-monospace,Consolas,monospace}.modal{position:fixed;inset:0;background:#071226e8;z-index:20;display:grid;place-items:center;padding:20px}.modal img{max-width:96vw;max-height:94vh;object-fit:contain;box-shadow:0 8px 40px #0008}.modal button{position:absolute;right:20px;top:16px;border:1px solid #ffffff66;background:#18294a;color:#fff;border-radius:99px;padding:8px 13px}.foot{margin-top:20px;color:var(--muted);font-size:12px;text-align:center}
    @media(max-width:900px){.actor-grid{grid-template-columns:1fr}.actor-title{position:static}.stats,.summary-grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.relay-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:520px){main{padding:14px}.stats,.summary-grid{grid-template-columns:1fr 1fr}.detail-head{flex-direction:column}.relay-row{grid-template-columns:48px 1fr 50px}}
  </style>
</head>
<body>
  <header class="top"><div><h1>CONC Batch 1 · 双 Actor 轨迹复盘</h1><p>8 次最终有效运行 · 按 Case 查看 A/B 并发动作、消息和截图</p></div><span class="tag">静态归档 · 2026-11-25</span></header>
  <main>
    <section id="overview">
      <div class="toolbar"><button id="homeBtn" class="primary">总览</button><span class="grow"></span><label class="muted">筛选</label><input id="search" placeholder="输入 Case 编号 / 状态 / 结束原因" aria-label="筛选 Case"></div>
      <div class="stats" id="topStats"></div>
      <div class="table-wrap"><table><thead><tr><th>Case / Run</th><th>状态</th><th>A 步数</th><th>B 步数</th><th>修复前 A/B</th><th>修复后 A/B</th><th>检查通过 A/B</th><th>declare_infeasible</th><th>结束原因</th></tr></thead><tbody id="caseRows"></tbody></table></div>
      <div class="foot">点击 Case 查看双栏时间轴。分项计数中，C04/C08 为本次离线逐项重评；其他 Case 由原始归一化分数换算。</div>
    </section>
    <section id="detail" class="hidden">
      <div class="toolbar"><button id="backBtn">← 返回总览</button><span class="grow"></span><label class="muted">事件筛选</label><select id="eventFilter"><option value="all">所有动作</option><option value="declare">declare_infeasible</option><option value="error">工具报错 / 拒绝</option><option value="conflict">短间隔双 Actor 桌面动作</option></select><input id="stepSearch" placeholder="搜索工具 / 参数 / 消息"></div>
      <div id="caseDetail"></div>
    </section>
  </main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><button id="closeModal">关闭 ✕</button><img id="modalImg" alt="放大截图"></div>
  <script src="dashboard-data.js"></script>
  <script>
  (()=>{
    const cases=window.CONC_DASHBOARD_CASES||[];let active=null;
    const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const score=v=>v===null||v===undefined?'—':Number(v).toFixed(4);
    const checkCount=x=>x&&x.passed!==null?`${x.passed}/${x.total}`:'—';
    const statusClass=s=>/ISSUE|CWI|问题|异常|404/i.test(s)?'issue':'ok';
    function renderOverview(){
      const totalSteps=cases.reduce((n,c)=>n+c.steps.A+c.steps.B,0), scored=cases.filter(c=>c.resultAvailable).length, declares=cases.filter(c=>c.declares.A||c.declares.B).length;
      $('#topStats').innerHTML=`<div class="stat"><div class="num">${cases.length}</div><div class="label">归档运行</div></div><div class="stat"><div class="num">${totalSteps.toLocaleString()}</div><div class="label">A/B 动作总数</div></div><div class="stat"><div class="num">${scored} / ${cases.length}</div><div class="label">已归档原始 result.json</div></div><div class="stat"><div class="num">${declares}</div><div class="label">触发 declare_infeasible 的 Case</div></div>`;
      const q=$('#search').value.toLowerCase();const rows=cases.filter(c=>JSON.stringify([c.id,c.status,c.endReason,c.runId]).toLowerCase().includes(q));
      $('#caseRows').innerHTML=rows.map(c=>`<tr data-case="${c.id}"><td><span class="case-id">${c.id}</span><br><small class="muted">${c.runId}</small></td><td><span class="pill ${statusClass(c.status)}">${c.status}</span></td><td>${c.steps.A}</td><td>${c.steps.B}</td><td class="score">${score(c.beforeScores?.A)} / ${score(c.beforeScores?.B)}</td><td class="score">${score(c.scores.A)} / ${score(c.scores.B)}</td><td>${checkCount(c.scoreAudit?.checks?.A)} / ${checkCount(c.scoreAudit?.checks?.B)}</td><td>${c.declares.A?'A ':''}${c.declares.B?'B':''}${!c.declares.A&&!c.declares.B?'—':''}</td><td>${c.endReason}</td></tr>`).join('');
      document.querySelectorAll('[data-case]').forEach(el=>el.onclick=()=>openCase(el.dataset.case));
    }
    function parseEpoch(t){if(typeof t==='number')return t>1e12?t/1000:t;const n=Date.parse(t);return Number.isFinite(n)?n/1000:NaN}
    function timeLabel(t){const n=parseEpoch(t);return Number.isFinite(n)?new Date(n*1000).toLocaleString():esc(t||'时间未知')}
    const guiTool=t=>!/(guest_cli|shell|terminal|read_file|write_file|browser.*text)/i.test(String(t||''))&&/(click|type|key|press|scroll|drag|move|hotkey|desktop|mouse)/i.test(String(t||''));
    function actionText(a){return JSON.stringify([a.tool,a.args,a.code,a.result,a.coordinate_audit]).toLowerCase()}
    function isDeclare(a){return /declare_infeasible/i.test(actionText(a))}
    function isError(a){const text=actionText(a),status=String(a.result?.status||'');return a.executed===false||/error|failed|\bfail\b|denied|blocked|rejected/i.test(status)||/read.?only|blocked|denied|refused|\berror\b|traceback|exception|http 4\d\d|\bfailed\b|permission denied/i.test(text)||((a.http_requests||[]).some(x=>Number(x.status||x.status_code)>=400))}
    function isConflict(a,other){if(!guiTool(a.tool))return false;const t=parseEpoch(a.t);if(!Number.isFinite(t))return false;return other.some(b=>guiTool(b.tool)&&Number.isFinite(parseEpoch(b.t))&&Math.abs(t-parseEpoch(b.t))<=1.5)}
    function fullReason(a){const x=a.args;if(x&&typeof x==='object'){for(const [k,v] of Object.entries(x)){if(/reason|explanation|message/i.test(k)&&v)return String(v)}}return JSON.stringify(x||a.result||{},null,2)}
    function actionHtml(a,actor,other){
      const decl=isDeclare(a),err=isError(a),conf=isConflict(a,other),cls=[decl?'declare':'',err?'error':'',conf?'conflict':''].filter(Boolean).join(' ');
      const flags=`${decl?'<span class="flag purple">declare_infeasible</span>':''}${err?'<span class="flag red">工具报错 / 拒绝</span>':''}${conf?'<span class="flag">≤1.5s 桌面动作交叠</span>':''}`;
      const art=a.screenshot_artifact||{};let shot='';if(art.path){const p=art.path.replaceAll('\\','/').split('/').pop();const src=`assets/${active.id}/${actor}/shots/${p}`;shot=`<a class="shot-link" href="${src}" data-zoom="${src}" title="点击放大"><img class="shot" loading="lazy" src="${src}" alt="${actor} 第 ${a.n} 步桌面截图"></a>`}
      const args=JSON.stringify(a.args??{},null,2);const result=typeof a.result==='string'?a.result:JSON.stringify(a.result??{},null,2);const code=a.code?`<div class="label">CLI / 调用代码</div><pre>${esc(a.code)}</pre>`:'';
      return `<article class="action ${cls}" data-flags="${decl?'declare ':''}${err?'error ':''}${conf?'conflict ':''}" data-text="${esc(actionText(a)).replaceAll('"','&quot;')}"><div class="action-head"><span class="step">#${a.n??'?'}</span><span class="time">${timeLabel(a.t)}</span><span class="tool">${esc(a.tool||'tool?')}</span>${flags}</div><div class="action-body"><div class="label">工具参数</div><pre>${esc(args)}</pre>${code}${decl?`<div class="label">declare_infeasible 完整理由</div><div class="reason">${esc(fullReason(a))}</div>`:''}${a.result!==undefined?`<div class="label">工具结果</div><pre>${esc(result)}</pre>`:''}${shot}</div></article>`
    }
    function relayHtml(c){const xs=c.relay||[],ok=xs.filter(x=>Number(x.upstream_status)===200).length,imgs=xs.reduce((m,x)=>Math.max(m,Number(x.input_image_parts)||0),0);const models=[...new Set(xs.map(x=>x.model).filter(Boolean))];return `<div class="panel"><h3>Relay 请求摘要</h3><div class="relay-grid"><div class="relay-stat"><b>${xs.length}</b><span class="muted">请求数</span></div><div class="relay-stat"><b>${ok} / ${xs.length||0}</b><span class="muted">HTTP 200</span></div><div class="relay-stat"><b>${imgs}</b><span class="muted">单请求最多图片</span></div><div class="relay-stat"><b>${esc(models.join(', ')||'—')}</b><span class="muted">模型 ID</span></div></div><details><summary>展开安全裁剪后的请求记录</summary><div class="relay-list">${xs.map(x=>`<div class="relay-row"><span>${esc(x.actor)}</span><span>${esc(timeLabel(x.time))}</span><span>HTTP ${esc(x.upstream_status??'—')}</span><span>${esc(x.input_image_parts??0)} img</span></div>`).join('')}</div></details></div>`}
    function scoreAuditHtml(c){
      const audit=c.scoreAudit;if(!audit)return '';
      const row=(actor)=>{const before=audit.before?.[actor],after=audit.after?.[actor],checks=audit.checks?.[actor];const detail=checks?.details?`<details><summary>检查点明细</summary><pre>${esc(Object.entries(checks.details).map(([k,v])=>`${k}: ${v?'通过':'未通过'}`).join('\n'))}</pre></details>`:'';return `<tr><td>Actor ${actor}</td><td>${score(before)}</td><td>${score(after)}</td><td>${checkCount(checks)}</td></tr><tr><td colspan='4'>${detail}</td></tr>`};
      return `<div class='panel'><h3>Oracle 评分复核</h3><div class='table-wrap'><table style='min-width:560px'><thead><tr><th>Actor</th><th>修复前</th><th>离线复评</th><th>分项通过</th></tr></thead><tbody>${row('A')}${row('B')}</tbody></table></div><p class='muted'>${esc(audit.note||'')}</p></div>`;
    }
    function openCase(id){active=cases.find(x=>x.id===id);if(!active)return;$('#overview').classList.add('hidden');$('#detail').classList.remove('hidden');const c=active;
      const scoreNote=c.scoreNote?`<div class="muted" style="margin-top:4px">${esc(c.scoreNote)}</div>`:'';
      const astate=c.actorStatuses?.agentA?.status||'未单列';const bstate=c.actorStatuses?.agentB?.status||'未单列';
      $('#caseDetail').innerHTML=`<div class="detail-head"><div><h2>${esc(c.id)} <span class="pill ${statusClass(c.status)}">${esc(c.status)}</span></h2><div class="meta">Run: <code>${esc(c.runId)}</code> · ${esc(c.mode||'shared')} · result Actor status: A ${esc(astate)} / B ${esc(bstate)}</div>${scoreNote}</div><div class="muted">结束原因：${esc(c.endReason)}</div></div><div class="summary-grid"><div class="stat"><div class="num">${c.steps.A} / ${c.steps.B}</div><div class="label">Actor A / B 步数</div></div><div class="stat"><div class="num">${score(c.scores.A)} / ${score(c.scores.B)}</div><div class="label">修复后 Actor A / B 得分</div></div><div class="stat"><div class="num">${c.declares.A?'A ':''}${c.declares.B?'B':''}${!c.declares.A&&!c.declares.B?'无':''}</div><div class="label">declare_infeasible</div></div><div class="stat"><div class="num">${c.resultAvailable?'已归档':'未生成'}</div><div class="label">原始运行 result.json</div></div></div>${scoreAuditHtml(c)}<div class="panel"><h3>Actor A / B 并排动作时间轴</h3><p class="muted">卡片列出每步工具、参数、结果与截图；模型可见文本在下方按 Actor 分列。原日志未把自然语言消息逐条绑定到 action，不作虚假对齐。橙色表示 1.5 秒内双方均有桌面操作（疑似焦点竞争），紫色为 declare_infeasible，红色为工具报错/拒绝。</p><div class="actor-grid"><div class="actor-col"><div class="actor-title"><strong>Actor A</strong><span>${c.actions.A.length} actions</span></div><div class="timeline" id="timelineA"></div></div><div class="actor-col"><div class="actor-title b"><strong>Actor B</strong><span>${c.actions.B.length} actions</span></div><div class="timeline" id="timelineB"></div></div></div></div><div class="actor-grid"><section class="panel"><h3>Actor A · 可见模型消息</h3><div class="reply-list">${messageHtml(c.messages.A)}</div></section><section class="panel"><h3>Actor B · 可见模型消息</h3><div class="reply-list">${messageHtml(c.messages.B)}</div></section></div>${relayHtml(c)}`;
      $('#timelineA').innerHTML=renderActions('A');$('#timelineB').innerHTML=renderActions('B');bindZoom();applyFilter();
    }
    function messageHtml(xs){return xs.length?xs.map(m=>`<div class="reply"><small>可见消息 · #${m.ordinal}</small>${esc(m.text)}</div>`).join(''):'<div class="empty">没有单独记录的可见文本消息</div>'}
    function renderActions(actor){const arr=active.actions[actor].slice().sort((a,b)=>{const ta=parseEpoch(a.t),tb=parseEpoch(b.t);return (Number.isFinite(ta)?ta:Infinity)-(Number.isFinite(tb)?tb:Infinity)||(Number(a.n)||0)-(Number(b.n)||0)}),other=active.actions[actor==='A'?'B':'A'];return arr.map(a=>actionHtml(a,actor,other)).join('')||'<div class="empty">没有动作记录</div>'}
    function applyFilter(){const filter=$('#eventFilter').value,q=$('#stepSearch').value.toLowerCase();document.querySelectorAll('.action').forEach(el=>{const flags=el.dataset.flags||'';const passFlag=filter==='all'||flags.includes(filter);const passQ=!q||(el.dataset.text||'').includes(q);el.classList.toggle('hidden',!passFlag||!passQ)})}
    function bindZoom(){document.querySelectorAll('[data-zoom]').forEach(a=>a.onclick=e=>{e.preventDefault();$('#modalImg').src=a.dataset.zoom;$('#modal').classList.remove('hidden')})}
    $('#search').addEventListener('input',renderOverview);$('#backBtn').onclick=()=>{$('#detail').classList.add('hidden');$('#overview').classList.remove('hidden');active=null};$('#homeBtn').onclick=()=>{$('#backBtn').click()};$('#eventFilter').onchange=applyFilter;$('#stepSearch').oninput=applyFilter;$('#closeModal').onclick=()=>$('#modal').classList.add('hidden');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.add('hidden')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.add('hidden')});
    renderOverview();
  })();
  </script>
</body>
</html>
